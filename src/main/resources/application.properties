spring.application.name=pr-guardian-lite

spring.data.mongodb.uri=mongodb://localhost:27017/pr_guardian

server.port=8080

# LLM provider config - read from environment variable, never hardcoded.
# We'll wire this up properly in Step 3.
llm.api-key=${ANTHROPIC_API_KEY:}
llm.model=claude-sonnet-4-6

# Embeddings provider - used by the retrieval layer (Step 2)
openai.api-key=${OPENAI_API_KEY:}